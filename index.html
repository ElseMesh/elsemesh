<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<title>ElseMesh</title>
	<link rel="preload" as="image" href="ui/elsemesh-splash.png" />
	<link rel="preconnect" href="https://fonts.googleapis.com" />
	<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
	<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Caveat+Brush&family=Kalam:wght@400;700&display=swap" rel="stylesheet" />
	<link rel="stylesheet" href="/src/ui/ui.css" />
	<style>
		html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
		#app, #app canvas { display: block; }
		#fps { position: fixed; top: 10px; left: 12px; z-index: 50; font: 500 12px/1.2 'JetBrains Mono', ui-monospace, monospace;
			color: #e8f6ff; background: rgba(8, 14, 22, 0.55); padding: 5px 9px; border-radius: 6px; pointer-events: none;
			backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); letter-spacing: 0.02em; }
		#build-commit { position: fixed; right: calc(6px + env(safe-area-inset-right, 0px)); bottom: calc(5px + env(safe-area-inset-bottom, 0px)); z-index: 1001;
			font: 500 10px/1 'JetBrains Mono', ui-monospace, monospace; letter-spacing: 0.04em; color: rgba(232, 246, 255, 0.78);
			background: rgba(8, 14, 22, 0.62); padding: 4px 5px; border-radius: 4px; pointer-events: none; user-select: text;
			backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px); }
	</style>
</head>
<body>
	<div id="app"></div>
	<div id="fps">-- fps</div>
	<div id="build-commit" aria-label="Build commit %ELSEMESH_COMMIT%" title="Build commit %ELSEMESH_COMMIT%">%ELSEMESH_COMMIT%</div>
	<div id="loader" role="status" aria-live="polite" aria-label="Loading ThruHold">
		<div class="loader-inner">
			<img class="loader-art" src="ui/elsemesh-splash.png" width="1672" height="941" alt="ElseMesh — connected ThruHolds" decoding="async" fetchpriority="high" />
			<div class="loader-world">
				<p class="loader-kicker">ThruHold</p>
				<h1 class="loader-title">Loading world experience…</h1>
				<p class="loader-tagline">Preparing this world.</p>
			</div>
			<div class="loader-panel">
				<div class="loader-row">
					<span class="loader-status">Starting…</span>
					<span class="loader-meta"><span class="loader-pct">0%</span><span class="loader-time">0:00</span></span>
				</div>
				<div class="loader-bar"><div class="loader-fill"></div><div class="loader-glint"></div></div>
				<div class="loader-note">Loading details are provided by this ThruHold.</div>
				<div class="loader-tips">
					<span class="loader-tip-label">Tip</span>
					<div class="loader-tip-list">
						<p class="loader-tip">Loading this ThruHold…</p>
					</div>
				</div>
			</div>
		</div>
	</div>
	<script type="module" src="/src/main.js"></script>
</body>
</html>
