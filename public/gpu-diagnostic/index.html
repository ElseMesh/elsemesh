<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>ElseMesh WebGPU check</title>
		<style>
			:root { color-scheme: dark; font: 16px/1.5 system-ui, sans-serif; background: #101820; color: #e7eef2; }
			body { max-width: 54rem; margin: 2rem auto; padding: 0 1rem; }
			h1 { color: #8ed8c2; }
			#status { padding: .8rem 1rem; border-left: 4px solid #e8bd63; background: #1b2a31; }
			#status[data-result="pass"] { border-color: #65d3a3; }
			#status[data-result="fail"] { border-color: #ff7777; }
			pre { white-space: pre-wrap; overflow-wrap: anywhere; padding: 1rem; background: #080e12; border-radius: .5rem; }
			button { font: inherit; padding: .55rem .9rem; }
		</style>
	</head>
	<body>
		<h1>WebGPU availability check</h1>
		<p>This page asks the browser for a WebGPU adapter and device, then creates a small buffer. It does not change browser flags or inspect browser internals.</p>
		<p id="status" role="status" aria-live="polite">Checking WebGPU…</p>
		<button id="copy" type="button" disabled>Copy report</button>
		<pre id="report">Starting…</pre>
		<script type="module">
			const status = document.querySelector( '#status' );
			const output = document.querySelector( '#report' );
			const copy = document.querySelector( '#copy' );
			const report = {
				url: location.href,
				secureContext: window.isSecureContext,
				userAgent: navigator.userAgent,
				gpuPropertyPresent: 'gpu' in navigator,
			};
			let stage = 'secure-context';
			const fail = ( stage, error ) => {
				report.failure = { stage, name: error?.name ?? 'Error', message: error?.message ?? String( error ) };
				status.dataset.result = 'fail';
				status.textContent = `WebGPU check failed at ${stage}: ${report.failure.name}: ${report.failure.message}`;
			};
			try {
				if ( ! window.isSecureContext ) throw Object.assign( new Error( 'WebGPU requires a secure context (HTTPS or localhost).' ), { name: 'InsecureContextError' } );
				stage = 'navigator.gpu';
				if ( ! navigator.gpu ) throw Object.assign( new Error( 'navigator.gpu is unavailable in this page.' ), { name: 'WebGPUUnavailableError' } );
				stage = 'requestAdapter';
				const adapter = await navigator.gpu.requestAdapter( { powerPreference: 'high-performance' } );
				if ( ! adapter ) throw Object.assign( new Error( 'requestAdapter() returned null.' ), { name: 'NullAdapterError' } );
				report.adapter = {
					info: adapter.info ? { vendor: adapter.info.vendor, architecture: adapter.info.architecture, device: adapter.info.device, description: adapter.info.description } : 'AdapterInfo unavailable',
					features: [ ...adapter.features ].sort(),
					limits: { maxBufferSize: adapter.limits.maxBufferSize, maxStorageBufferBindingSize: adapter.limits.maxStorageBufferBindingSize, maxTextureDimension2D: adapter.limits.maxTextureDimension2D },
				};
				stage = 'requestDevice';
				const device = await adapter.requestDevice();
				device.addEventListener( 'uncapturederror', ( event ) => {
					report.uncapturedError = { name: event.error.name, message: event.error.message };
					output.textContent = JSON.stringify( report, null, 2 );
				} );
				stage = 'createBuffer';
				const buffer = device.createBuffer( { size: 256, usage: GPUBufferUsage.STORAGE | GPUBufferUsage.COPY_DST } );
				buffer.destroy();
				device.destroy();
				report.deviceRequest = 'passed';
				report.bufferCreation = 'passed (256-byte storage buffer)';
				status.dataset.result = 'pass';
				status.textContent = 'WebGPU adapter, device, and buffer creation all passed.';
			} catch ( error ) {
				fail( stage, error );
			}
			output.textContent = JSON.stringify( report, null, 2 );
			copy.disabled = false;
			copy.addEventListener( 'click', async () => {
				await navigator.clipboard.writeText( output.textContent );
				copy.textContent = 'Copied';
			} );
		</script>
	</body>
</html>
